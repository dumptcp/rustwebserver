[package]
name = "rustwebserver"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "rustwebserver"
path = "main.rs"

[dependencies]
actix-web = { version = "4.13", default-features = false, features = ["macros"] }
bytes = "1"
rlimit = "0.11"
walkdir = "2"
mime_guess = "2"
percent-encoding = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
