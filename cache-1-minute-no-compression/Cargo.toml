[package]
name = "rawstatic"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rawstatic"
path = "main.rs"

[dependencies]
arc-swap = "1"
brotli = "9"
bytes = "1"
http = "1"
httparse = "1"
httpdate = "1"
mime_guess = "2"
percent-encoding = "2"
rlimit = "0.11"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "signal", "sync", "macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
