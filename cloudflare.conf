#!/usr/sbin/nft -f

# Set SSH_PORT to the port you use for SSH.
# Set WEB_PORT to the PORT this server listens on.
define SSH_PORT = 22
define WEB_PORT = 80

# Recreate only this table, so loading the file again replaces these rules and
# leaves every other table alone. The empty table makes `delete` succeed the
# first time, when `inet webfw` does not exist yet. The forward hook is not
# set here, so Docker's forwarded traffic is left as it was.
table inet webfw {}
delete table inet webfw

table inet webfw {
    set cf4 {
        type ipv4_addr
        flags interval
        elements = { 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22 }
    }

    set cf6 {
        type ipv6_addr
        flags interval
        elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept

        iif lo accept

        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } ip6 hoplimit 255 accept
        ip6 saddr fe80::/10 icmpv6 type mld-listener-query accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        ip saddr @cf4 tcp dport $WEB_PORT accept
        ip6 saddr @cf6 tcp dport $WEB_PORT accept

        tcp dport $SSH_PORT accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
