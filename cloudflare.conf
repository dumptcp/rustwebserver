#!/usr/sbin/nft -f
# Cloudflare-only firewall for everydaynews.online.
# All TCP ports accepted from Cloudflare IPs. SSH port 22 open for login.
# Everything else dropped. Backend IP hidden: only Cloudflare can reach the web server.

flush ruleset

table inet fw {
    set cf4 {
        type ipv4_addr
        flags interval
        elements = { 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22 }
    }

    set cf6 {
        type ipv6_addr
        flags interval
        elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Established connections first: most packets match here and skip the set lookups
        ct state established,related accept

        iif lo accept

        # All TCP from Cloudflare
        ip saddr @cf4 tcp dport 1-65535 accept
        ip6 saddr @cf6 tcp dport 1-65535 accept

        # SSH for login
        tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
